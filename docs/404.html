<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Quant Agent</title>
  <!-- GitHub Pages SPA redirect: forward 404 → index.html with path preserved -->
  <script>
    var seg = 1; // number of path segments to keep (1 = repo-name)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
